name: Code Quality

permissions:
  contents: write

on:
  push:
    branches: [ "main", "migration/port-agent-foundation" ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'uv.lock'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'uv.lock'
  workflow_call: # Allow other workflows to call this

jobs:
  test:
    name: Format PR branch with pinned Ruff
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --locked

      - name: Format changed takeover files
        run: uv run ruff format src/blacki/browser_takeover/routes.py tests/browser_takeover/test_routes.py

      - name: Commit formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/blacki/browser_takeover/routes.py tests/browser_takeover/test_routes.py
          if git diff --cached --quiet; then
            echo "No formatter changes needed"
            exit 0
          fi
          git commit -m "style: apply pinned Ruff formatter"
          git push origin HEAD:${{ github.head_ref }}
