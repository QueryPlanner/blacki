name: Code Quality

permissions:
  contents: write

on:
  push:
    branches: [ "main", "migration/port-agent-foundation" ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'uv.lock'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'uv.lock'
  workflow_call: # Allow other workflows to call this

jobs:
  test:
    name: Apply MyPy narrowing fix
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Patch type guards
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/blacki/browser_takeover/routes.py")
          text = path.read_text()
          replacements = {
              "from typing import Any\n": "from typing import Any, TypeGuard\n",
              "def _is_int(value: Any) -> bool:\n": "def _is_int(value: Any) -> TypeGuard[int]:\n",
              "def _is_number(value: Any) -> bool:\n": "def _is_number(value: Any) -> TypeGuard[int | float]:\n",
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one occurrence: {old!r}")
              text = text.replace(old, new)
          path.write_text(text)
          PY

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --locked

      - name: Format and verify narrowing fix
        run: |
          uv run ruff format src/blacki/browser_takeover/routes.py
          uv run ruff check src/blacki/browser_takeover/routes.py
          uv run mypy src/blacki/browser_takeover/routes.py

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/blacki/browser_takeover/routes.py
          git commit -m "fix: type browser protocol validators"
          git push origin HEAD:${{ github.head_ref }}
