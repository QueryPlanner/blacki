name: Sandbox Image

"on":
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Test sandbox image (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build sandbox image
        uses: docker/build-push-action@v5
        with:
          context: deploy/sandbox-image
          platforms: ${{ matrix.platform }}
          load: true
          tags: blacki-sandbox:dev
      - name: Test sandbox tools and startup
        run: bash scripts/sandbox-image-check.sh blacki-sandbox:dev
