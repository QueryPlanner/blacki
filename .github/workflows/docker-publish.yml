name: Docker Publish

on:
  push:
    branches: [ "main" ]
    tags: [ 'v*.*.*' ]

env:
  REGISTRY: ghcr.io

jobs:
  # 1. Run Code Quality First
  quality:
    uses: ./.github/workflows/code-quality.yml

  # 2. Build and Push after Quality passes
  build:
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-digest: ${{ steps.build-push.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Downcase IMAGE_NAME
        run: |
          echo "IMAGE_NAME=${GITHUB_REPOSITORY@L}" >> "${GITHUB_ENV}"

      # Multi-platform support (qemu + buildx)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=long
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        id: build-push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Multi-platform builds for Bare Metal (ARM64 for Pis, AMD64 for Cloud)
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          # Borrowed high-perf caching
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: >-
      github.ref == 'refs/heads/main' &&
      github.repository == 'QueryPlanner/blacki'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: blacki-production
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Connect to Tailscale network for secure SSH access
      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TS_AUTH_KEY }}

      - name: Deploy to Server via Tailscale
        env:
          SERVER_HOST: ${{ secrets.SERVER_TAILSCALE_IP }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_SHA: ${{ github.sha }}
          IMAGE_DIGEST: ${{ needs.build.outputs.image-digest }}
          # Optional Compose host binding; defaults to the server's current value.
          HOST_BIND_IP: ${{ secrets.HOST_BIND_IP }}
          # App secrets for .env generation
          AGENT_NAME: ${{ secrets.AGENT_NAME }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ROOT_AGENT_MODEL: ${{ secrets.ROOT_AGENT_MODEL }}
          TELEGRAM_ENABLED: ${{ secrets.TELEGRAM_ENABLED }}
          TELEGRAM_ACCESS_CODE: ${{ secrets.TELEGRAM_ACCESS_CODE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_TOOL_NOTIFICATIONS: ${{ secrets.TELEGRAM_TOOL_NOTIFICATIONS }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          KOKORO_TTS_BASE_URL: ${{ secrets.KOKORO_TTS_BASE_URL }}
          KOKORO_TTS_VOICE: ${{ secrets.KOKORO_TTS_VOICE }}
          ZEPTO_MCP_ENABLED: ${{ secrets.ZEPTO_MCP_ENABLED }}
          ZEPTO_MCP_CONFIG_DIR: ${{ secrets.ZEPTO_MCP_CONFIG_DIR }}
          ZEPTO_MCP_ALLOWED_TELEGRAM_CHAT_IDS: ${{ secrets.ZEPTO_MCP_ALLOWED_TELEGRAM_CHAT_IDS }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
          BROWSER_USE_API_KEY: ${{ secrets.BROWSER_USE_API_KEY }}
          SANDBOX_ENABLED: ${{ secrets.SANDBOX_ENABLED }}
          SANDBOX_DOMAIN: ${{ secrets.SANDBOX_DOMAIN }}
          R2_FILES_ENABLED: ${{ secrets.R2_FILES_ENABLED }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_OWNER_HMAC_SECRET: ${{ secrets.R2_OWNER_HMAC_SECRET }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_HEALTH_CLIENT_ID: ${{ secrets.GOOGLE_HEALTH_CLIENT_ID }}
          GOOGLE_HEALTH_CLIENT_SECRET: ${{ secrets.GOOGLE_HEALTH_CLIENT_SECRET }}
          GOOGLE_HEALTH_REDIRECT_URI: ${{ secrets.GOOGLE_HEALTH_REDIRECT_URI }}
          GOOGLE_HEALTH_TOKEN_ENCRYPTION_KEY: ${{ secrets.GOOGLE_HEALTH_TOKEN_ENCRYPTION_KEY }}
          MEM0_QDRANT_URL: ${{ secrets.MEM0_QDRANT_URL }}
          MEM0_QDRANT_API_KEY: ${{ secrets.MEM0_QDRANT_API_KEY }}
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
          OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_TRACES_ENDPOINT }}
          OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_LOGS_ENDPOINT }}
          OTEL_EXPORTER_OTLP_PROTOCOL: ${{ secrets.OTEL_EXPORTER_OTLP_PROTOCOL }}
          OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
          OTEL_EXPORTER_OTLP_TRACES_PROTOCOL: ${{ secrets.OTEL_EXPORTER_OTLP_TRACES_PROTOCOL }}
          OTEL_EXPORTER_OTLP_TRACES_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_TRACES_HEADERS }}
        run: |
          umask 077
          LOCAL_DEPLOY_DIR=$(mktemp -d "${RUNNER_TEMP}/blacki-deploy.XXXXXX")
          LOCAL_ENV_FILE="$LOCAL_DEPLOY_DIR/deploy.env"
          LOCAL_GHCR_TOKEN_FILE="$LOCAL_DEPLOY_DIR/ghcr.token"
          REMOTE_DEPLOY_DIR=""
          REMOTE_DEPLOY_DIR_ARG=""

          cleanup_transfer() {
            local status=$?
            trap - EXIT
            rm -f "$LOCAL_ENV_FILE" "$LOCAL_GHCR_TOKEN_FILE"
            rmdir "$LOCAL_DEPLOY_DIR" 2>/dev/null || true

            if [ -n "$REMOTE_DEPLOY_DIR" ]; then
              ssh -o StrictHostKeyChecking=no "$SERVER_USER@$SERVER_HOST" \
                "bash -s -- $REMOTE_DEPLOY_DIR_ARG" << 'REMOTE_CLEANUP' || true
          set -e
          transfer_dir=$1
          case "$transfer_dir" in
            "$HOME"/.blacki-deploy/run.*) ;;
            *) exit 1 ;;
          esac
          rm -f "$transfer_dir/deploy.env" "$transfer_dir/ghcr.token"
          rmdir "$transfer_dir" 2>/dev/null || true
          REMOTE_CLEANUP
            fi

            exit "$status"
          }
          trap cleanup_transfer EXIT

          # Setup SSH key
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          # Serialize secrets without interpolation or shell evaluation.
          python3 scripts/write_compose_env.py "$LOCAL_ENV_FILE" \
            HOST_BIND_IP \
            AGENT_NAME \
            OPENROUTER_API_KEY \
            ROOT_AGENT_MODEL \
            TELEGRAM_ENABLED \
            TELEGRAM_ACCESS_CODE \
            TELEGRAM_BOT_TOKEN \
            TELEGRAM_TOOL_NOTIFICATIONS \
            CLOUDFLARE_ACCOUNT_ID \
            CLOUDFLARE_API_TOKEN \
            KOKORO_TTS_BASE_URL \
            KOKORO_TTS_VOICE \
            ZEPTO_MCP_ENABLED \
            ZEPTO_MCP_CONFIG_DIR \
            ZEPTO_MCP_ALLOWED_TELEGRAM_CHAT_IDS \
            EXA_API_KEY \
            BRAVE_SEARCH_API_KEY \
            BROWSER_USE_API_KEY \
            SANDBOX_ENABLED \
            SANDBOX_DOMAIN \
            R2_FILES_ENABLED \
            R2_ENDPOINT_URL \
            R2_BUCKET_NAME \
            R2_ACCESS_KEY_ID \
            R2_SECRET_ACCESS_KEY \
            R2_OWNER_HMAC_SECRET \
            GOOGLE_API_KEY \
            GOOGLE_HEALTH_CLIENT_ID \
            GOOGLE_HEALTH_CLIENT_SECRET \
            GOOGLE_HEALTH_REDIRECT_URI \
            GOOGLE_HEALTH_TOKEN_ENCRYPTION_KEY \
            MEM0_QDRANT_URL \
            MEM0_QDRANT_API_KEY \
            OTEL_EXPORTER_OTLP_ENDPOINT \
            OTEL_EXPORTER_OTLP_TRACES_ENDPOINT \
            OTEL_EXPORTER_OTLP_LOGS_ENDPOINT \
            OTEL_EXPORTER_OTLP_PROTOCOL \
            OTEL_EXPORTER_OTLP_HEADERS \
            OTEL_EXPORTER_OTLP_TRACES_PROTOCOL \
            OTEL_EXPORTER_OTLP_TRACES_HEADERS
          printf '%s' "$GH_TOKEN" > "$LOCAL_GHCR_TOKEN_FILE"

          # Copy into a private, unique remote directory and reapply restrictive
          # permissions independently of scp's mode behavior.
          REMOTE_DEPLOY_DIR=$(
            ssh -o StrictHostKeyChecking=no "$SERVER_USER@$SERVER_HOST" \
              'umask 077; mkdir -p "$HOME/.blacki-deploy"; chmod 700 "$HOME/.blacki-deploy"; mktemp -d "$HOME/.blacki-deploy/run.XXXXXX"'
          )
          case "$REMOTE_DEPLOY_DIR" in
            /*/.blacki-deploy/run.*) ;;
            *) echo "ERROR: Invalid remote transfer directory."; exit 1 ;;
          esac
          printf -v REMOTE_DEPLOY_DIR_ARG '%q' "$REMOTE_DEPLOY_DIR"
          scp -o StrictHostKeyChecking=no \
            "$LOCAL_ENV_FILE" "$LOCAL_GHCR_TOKEN_FILE" \
            "$SERVER_USER@$SERVER_HOST:$REMOTE_DEPLOY_DIR/"
          ssh -o StrictHostKeyChecking=no "$SERVER_USER@$SERVER_HOST" \
            "bash -s -- $REMOTE_DEPLOY_DIR_ARG" << 'REMOTE_PERMISSIONS'
          set -e
          transfer_dir=$1
          case "$transfer_dir" in
            "$HOME"/.blacki-deploy/run.*) ;;
            *) exit 1 ;;
          esac
          chmod 600 "$transfer_dir/deploy.env" "$transfer_dir/ghcr.token"
          REMOTE_PERMISSIONS

          # Commit and digest contain only Git-generated hexadecimal identifiers.
          ssh -o StrictHostKeyChecking=no "$SERVER_USER@$SERVER_HOST" \
            "bash -s -- '$DEPLOY_SHA' '$IMAGE_DIGEST' $REMOTE_DEPLOY_DIR_ARG" \
            << 'DEPLOY_SCRIPT'
          set -e

          DEPLOY_SHA=$1
          IMAGE_DIGEST=$2
          TRANSFER_DIR=$3
          case "$TRANSFER_DIR" in
            "$HOME"/.blacki-deploy/run.*) ;;
            *) echo "ERROR: Invalid transfer directory."; exit 1 ;;
          esac
          DEPLOY_ENV_FILE="$TRANSFER_DIR/deploy.env"
          GHCR_TOKEN_FILE="$TRANSFER_DIR/ghcr.token"
          trap 'rm -f "$DEPLOY_ENV_FILE" "$GHCR_TOKEN_FILE"; rmdir "$TRANSFER_DIR" 2>/dev/null || true' EXIT
          if [ "${#DEPLOY_SHA}" -ne 40 ] || \
            [ -n "${DEPLOY_SHA//[0-9a-f]/}" ]; then
            echo "ERROR: Invalid deployment commit."
            exit 1
          fi
          DIGEST_HEX=${IMAGE_DIGEST#sha256:}
          if [ "${#IMAGE_DIGEST}" -ne 71 ] || \
            [ "$DIGEST_HEX" = "$IMAGE_DIGEST" ] || \
            [ -n "${DIGEST_HEX//[0-9a-f]/}" ]; then
            echo "ERROR: Invalid image digest."
            exit 1
          fi

          # 1. Set dynamic project directory based on repository name
          PROJECT_NAME="blacki"
          PROJECT_DIR="$HOME/apps/$PROJECT_NAME"
          IMAGE_NAME="ghcr.io/queryplanner/blacki@${IMAGE_DIGEST}"
          SMOKE_PROJECT="${PROJECT_NAME}-smoke-${DEPLOY_SHA:0:12}-$$"
          SMOKE_STARTED=false
          SMOKE_CONTAINER_ID=""
          CHECKOUT_CHANGED=false
          PROMOTION_STARTED=false
          DEPLOYMENT_HEALTHY=false
          HAS_ROLLBACK=false
          ROLLBACK_FAILED=false
          PREVIOUS_REVISION=""
          PREVIOUS_IMAGE=""
          ROLLBACK_ENV="$PROJECT_DIR/.env.rollback"

          wait_for_container_ready() {
            local container_id=$1
            local label=$2
            local attempt=1

            while [ "$attempt" -le 12 ]; do
              if docker exec "$container_id" python -c \
                'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8080/ready", timeout=3).read()' \
                >/dev/null 2>&1; then
                echo "$label readiness check passed."
                return 0
              fi

              local running
              running=$(
                docker inspect --format '{{.State.Running}}' \
                  "$container_id" 2>/dev/null || true
              )
              if [ "$running" != "true" ]; then
                echo "$label exited before becoming ready."
                return 1
              fi

              echo "$label readiness attempt $attempt/12 failed; retrying in 5s..."
              attempt=$((attempt + 1))
              sleep 5
            done

            return 1
          }

          wait_for_host_ready() {
            local host=$1
            local port=$2
            local container_id=$3
            local label=$4
            local attempt=1

            while [ "$attempt" -le 12 ]; do
              if curl -sf "http://${host}:${port}/ready" \
                >/dev/null 2>&1; then
                echo "$label readiness check passed on port ${port}."
                return 0
              fi

              local running
              running=$(
                docker inspect --format '{{.State.Running}}' \
                  "$container_id" 2>/dev/null || true
              )
              if [ "$running" != "true" ]; then
                echo "$label exited before becoming ready."
                return 1
              fi

              echo "$label readiness attempt $attempt/12 failed; retrying in 5s..."
              attempt=$((attempt + 1))
              sleep 5
            done

            return 1
          }

          cleanup_smoke() {
            if [ "$SMOKE_STARTED" = true ]; then
              IMAGE="$IMAGE_NAME" ENV_FILE=.env.next \
                docker compose --project-name "$SMOKE_PROJECT" \
                  --env-file .env.next -f compose.smoke.yaml \
                  down --remove-orphans >/dev/null 2>&1 || true
              SMOKE_STARTED=false
              SMOKE_CONTAINER_ID=""
            fi
          }

          rollback_deployment() {
            echo "Stopping failed promoted deployment..."
            if ! docker compose -f compose.yaml -f compose.prod.yaml \
              down --remove-orphans; then
              echo "Failed to stop the promoted deployment."
              return 1
            fi

            if [ "$HAS_ROLLBACK" != true ]; then
              echo "No previously healthy deployment is available for rollback."
              return 1
            fi

            echo "Rolling back to ${PREVIOUS_REVISION}..."
            git -c advice.detachedHead=false checkout --detach "$PREVIOUS_REVISION" \
              || return 1
            CHECKOUT_CHANGED=false
            mv "$ROLLBACK_ENV" .env || return 1

            IMAGE="$PREVIOUS_IMAGE" ENV_FILE=.env \
              docker compose --env-file .env \
                -f compose.yaml -f compose.prod.yaml up -d || return 1

            local rollback_container_id
            rollback_container_id=$(
              docker compose -f compose.yaml -f compose.prod.yaml \
                ps --all -q agent
            )
            if [ -z "$rollback_container_id" ]; then
              echo "Rollback did not create the agent container."
              return 1
            fi

            local rollback_host_bind_ip
            rollback_host_bind_ip=$(
              sed -n 's/^HOST_BIND_IP="\{0,1\}\([0-9][0-9.]*\)"\{0,1\}$/\1/p' \
                .env 2>/dev/null | tail -n 1
            )
            case "$rollback_host_bind_ip" in
              ''|*[!0-9.]*) rollback_host_bind_ip=127.0.0.1 ;;
            esac
            if wait_for_host_ready \
              "$rollback_host_bind_ip" "$HOST_PORT" \
              "$rollback_container_id" "Rollback"; then
              echo "Rollback restored the previous healthy deployment."
              return 0
            fi

            docker compose -f compose.yaml -f compose.prod.yaml \
              logs --tail=100
            return 1
          }

          cleanup() {
            local status=$?
            trap - EXIT
            set +e

            cleanup_smoke
            if [ "$PROMOTION_STARTED" = true ]; then
              if [ "$DEPLOYMENT_HEALTHY" != true ]; then
                if ! rollback_deployment; then
                  if [ "$HAS_ROLLBACK" = true ]; then
                    ROLLBACK_FAILED=true
                    echo "ERROR: Automatic rollback failed."
                  fi
                fi
              fi
            elif [ "$CHECKOUT_CHANGED" = true ]; then
              if ! git -c advice.detachedHead=false checkout --detach \
                "$PREVIOUS_REVISION"; then
                echo "ERROR: Failed to restore the pre-deployment revision."
              fi
            fi

            rm -f "$PROJECT_DIR/.env.next" \
              "$DEPLOY_ENV_FILE" "$GHCR_TOKEN_FILE"
            rmdir "$TRANSFER_DIR" 2>/dev/null || true
            if [ "$ROLLBACK_FAILED" = true ] && [ -f "$ROLLBACK_ENV" ]; then
              echo "Preserved rollback environment at $ROLLBACK_ENV."
            else
              rm -f "$ROLLBACK_ENV"
            fi
            exit "$status"
          }
          trap cleanup EXIT

          echo "=== Deploying $PROJECT_NAME to $PROJECT_DIR ==="

          # 2. Ensure project directory exists
          mkdir -p "$PROJECT_DIR"
          if [ ! -d "$PROJECT_DIR/.git" ]; then
            echo "Project not found. Cloning..."
            git clone https://github.com/QueryPlanner/blacki "$PROJECT_DIR"
          fi

          # 3. Capture the active deployment before checking out the candidate.
          cd "$PROJECT_DIR"
          PREVIOUS_REVISION=$(git rev-parse HEAD)
          HOST_PORT=$(
            sed -n 's/^HOST_PORT="\{0,1\}\([0-9][0-9]*\)"\{0,1\}$/\1/p' \
              .env 2>/dev/null | tail -n 1
          )
          case "$HOST_PORT" in
            ''|*[!0-9]*) HOST_PORT=8080 ;;
          esac
          if [ "$HOST_PORT" -lt 1 ] || [ "$HOST_PORT" -gt 65535 ]; then
            HOST_PORT=8080
          fi
          HOST_BIND_IP=$(
            sed -n 's/^HOST_BIND_IP="\{0,1\}\([0-9][0-9.]*\)"\{0,1\}$/\1/p' \
              .env 2>/dev/null | tail -n 1
          )
          case "$HOST_BIND_IP" in
            ''|*[!0-9.]*) HOST_BIND_IP=127.0.0.1 ;;
          esac
          ACTIVE_HOST_BIND_IP="$HOST_BIND_IP"
          DEPLOY_HOST_BIND_IP=$(
            sed -n 's/^HOST_BIND_IP="\{0,1\}\([0-9][0-9.]*\)"\{0,1\}$/\1/p' \
              "$DEPLOY_ENV_FILE" 2>/dev/null | tail -n 1
          )
          case "$DEPLOY_HOST_BIND_IP" in
            ''|*[!0-9.]*) ;;
            *) HOST_BIND_IP="$DEPLOY_HOST_BIND_IP" ;;
          esac

          ACTIVE_CONTAINER_ID=$(
            docker ps \
              --filter "label=com.docker.compose.project=${PROJECT_NAME}" \
              --filter "label=com.docker.compose.service=agent" \
              --format '{{.ID}}' | head -n 1
          )
          if [ -n "$ACTIVE_CONTAINER_ID" ] && [ -f .env ] && \
            curl -sf "http://${ACTIVE_HOST_BIND_IP}:${HOST_PORT}/ready" \
              >/dev/null 2>&1; then
            PREVIOUS_IMAGE=$(
              docker inspect --format '{{.Config.Image}}' "$ACTIVE_CONTAINER_ID"
            )
            if [ -n "$PREVIOUS_IMAGE" ]; then
              cp .env "$ROLLBACK_ENV"
              chmod 600 "$ROLLBACK_ENV"
              HAS_ROLLBACK=true
              echo "Captured healthy deployment for automatic rollback."
            fi
          else
            echo "No healthy active deployment detected; rollback is unavailable."
          fi

          git fetch origin main
          git cat-file -e "${DEPLOY_SHA}^{commit}"
          git -c advice.detachedHead=false checkout --detach "$DEPLOY_SHA"
          CHECKOUT_CHANGED=true

          # 4. Stage the transferred app environment and safe deployment metadata.
          echo "Staging deployment environment..."
          cp "$DEPLOY_ENV_FILE" .env.next
          {
            printf 'DEPLOY_SHA="%s"\n' "$DEPLOY_SHA"
            printf 'IMAGE="%s"\n' "$IMAGE_NAME"
            printf 'HOST_PORT="%s"\n' "$HOST_PORT"
            printf 'HOST_BIND_IP="%s"\n' "$HOST_BIND_IP"
          } >> .env.next
          chmod 600 .env.next

          # 5. Pull and start the exact image in an isolated smoke environment before
          # interrupting the running deployment.
          docker login ghcr.io -u queryplanner \
            --password-stdin < "$GHCR_TOKEN_FILE"
          export IMAGE="$IMAGE_NAME"
          export ENV_FILE=.env.next
          echo "Pulling candidate image..."
          docker pull "$IMAGE_NAME"
          docker compose --env-file .env.next \
            -f compose.yaml -f compose.prod.yaml config --quiet
          SMOKE_STARTED=true
          docker compose --project-name "$SMOKE_PROJECT" \
            --env-file .env.next -f compose.smoke.yaml up -d
          SMOKE_CONTAINER_ID=$(
            docker compose --project-name "$SMOKE_PROJECT" \
              -f compose.smoke.yaml ps --all -q agent
          )
          if [ -z "$SMOKE_CONTAINER_ID" ]; then
            echo "Candidate smoke test did not create the agent container."
            docker compose --project-name "$SMOKE_PROJECT" \
              -f compose.smoke.yaml logs --no-color
            exit 1
          fi

          if ! wait_for_container_ready \
            "$SMOKE_CONTAINER_ID" "Candidate"; then
            echo "Candidate failed isolated startup; active service is unchanged."
            docker compose --project-name "$SMOKE_PROJECT" \
              -f compose.smoke.yaml logs --no-color
            exit 1
          fi
          cleanup_smoke

          # 6. Promote the preflighted configuration and restart the deployment.
          PROMOTION_STARTED=true
          echo "Stopping existing containers..."
          docker compose -f compose.yaml -f compose.prod.yaml \
            down --remove-orphans

          echo "Using port: $HOST_PORT"
          mv .env.next .env
          export ENV_FILE=.env

          echo "Starting candidate image..."
          docker compose --env-file .env \
            -f compose.yaml -f compose.prod.yaml up -d
          PROMOTED_CONTAINER_ID=$(
            docker compose -f compose.yaml -f compose.prod.yaml \
              ps --all -q agent
          )
          if [ -z "$PROMOTED_CONTAINER_ID" ]; then
            echo "Promoted deployment did not create the agent container."
            exit 1
          fi

          if ! wait_for_host_ready \
            "$HOST_BIND_IP" "$HOST_PORT" \
            "$PROMOTED_CONTAINER_ID" "Promoted deployment"; then
            echo "Promoted deployment failed; checking logs before rollback..."
            docker compose -f compose.yaml -f compose.prod.yaml logs --tail=100
            exit 1
          fi
          DEPLOYMENT_HEALTHY=true

          # 7. Reclaim image and builder cache only after successful promotion.
          echo "Cleaning up old Docker resources..."
          docker image prune -af 2>/dev/null || true
          docker builder prune -af 2>/dev/null || true

          # 8. Show status
          echo "=== Deployment Complete ==="
          docker compose -f compose.yaml -f compose.prod.yaml ps
          df -h /
          DEPLOY_SCRIPT

      - name: Cleanup SSH
        if: always()
        run: |
          rm -f ~/.ssh/id_rsa
