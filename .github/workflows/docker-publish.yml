name: Docker Publish

on:
  push:
    branches: [ "main" ]
    tags: [ 'v*.*.*' ]

env:
  REGISTRY: ghcr.io

jobs:
  # 1. Run Code Quality First
  quality:
    uses: ./.github/workflows/code-quality.yml

  # 2. Build and Push after Quality passes
  build:
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-digest: ${{ steps.build-push.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Downcase IMAGE_NAME
        run: |
          echo "IMAGE_NAME=${GITHUB_REPOSITORY@L}" >> "${GITHUB_ENV}"

      # Multi-platform support (qemu + buildx)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=long
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        id: build-push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Multi-platform builds for Bare Metal (ARM64 for Pis, AMD64 for Cloud)
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          # Borrowed high-perf caching
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: >-
      github.ref == 'refs/heads/main' &&
      github.repository == 'QueryPlanner/blacki'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: blacki-production
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Connect to Tailscale network for secure SSH access
      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TS_AUTH_KEY }}

      - name: Deploy to Server via Tailscale
        env:
          SERVER_HOST: ${{ secrets.SERVER_TAILSCALE_IP }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_SHA: ${{ github.sha }}
          IMAGE_DIGEST: ${{ needs.build.outputs.image-digest }}
          # App secrets for .env generation
          AGENT_NAME: ${{ secrets.AGENT_NAME }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ROOT_AGENT_MODEL: ${{ secrets.ROOT_AGENT_MODEL }}
          TELEGRAM_ENABLED: ${{ secrets.TELEGRAM_ENABLED }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_TOOL_NOTIFICATIONS: ${{ secrets.TELEGRAM_TOOL_NOTIFICATIONS }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
          BROWSER_USE_API_KEY: ${{ secrets.BROWSER_USE_API_KEY }}
          SANDBOX_ENABLED: ${{ secrets.SANDBOX_ENABLED }}
          SANDBOX_DOMAIN: ${{ secrets.SANDBOX_DOMAIN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          MEM0_QDRANT_URL: ${{ secrets.MEM0_QDRANT_URL }}
          MEM0_QDRANT_API_KEY: ${{ secrets.MEM0_QDRANT_API_KEY }}
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
          OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_TRACES_ENDPOINT }}
          OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_LOGS_ENDPOINT }}
          OTEL_EXPORTER_OTLP_PROTOCOL: ${{ secrets.OTEL_EXPORTER_OTLP_PROTOCOL }}
          OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
          OTEL_EXPORTER_OTLP_TRACES_PROTOCOL: ${{ secrets.OTEL_EXPORTER_OTLP_TRACES_PROTOCOL }}
          OTEL_EXPORTER_OTLP_TRACES_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_TRACES_HEADERS }}
        run: |
          # Setup SSH key
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          # Create .env file locally to avoid SSH quoting issues with special chars
          # (DATABASE_URL contains & which breaks SSH command parsing)
          # Values are double-quoted so shell metacharacters (& ? @ =) are treated literally
          # when this file is sourced on the remote server.
          cat > /tmp/deploy.env << ENVFILE
          DEPLOY_SHA="${DEPLOY_SHA}"
          IMAGE_DIGEST="${IMAGE_DIGEST}"
          AGENT_NAME="${AGENT_NAME}"
          OPENROUTER_API_KEY="${OPENROUTER_API_KEY}"
          ROOT_AGENT_MODEL="${ROOT_AGENT_MODEL}"
          TELEGRAM_ENABLED="${TELEGRAM_ENABLED}"
          TELEGRAM_BOT_TOKEN="${TELEGRAM_BOT_TOKEN}"
          TELEGRAM_TOOL_NOTIFICATIONS="${TELEGRAM_TOOL_NOTIFICATIONS}"
          EXA_API_KEY="${EXA_API_KEY}"
          BRAVE_SEARCH_API_KEY="${BRAVE_SEARCH_API_KEY}"
          BROWSER_USE_API_KEY="${BROWSER_USE_API_KEY}"
          SANDBOX_ENABLED="${SANDBOX_ENABLED}"
          SANDBOX_DOMAIN="${SANDBOX_DOMAIN}"
          GH_TOKEN="${GH_TOKEN}"
          GOOGLE_API_KEY="${GOOGLE_API_KEY}"
          MEM0_QDRANT_URL="${MEM0_QDRANT_URL}"
          MEM0_QDRANT_API_KEY="${MEM0_QDRANT_API_KEY}"
          OTEL_EXPORTER_OTLP_ENDPOINT="${OTEL_EXPORTER_OTLP_ENDPOINT}"
          OTEL_EXPORTER_OTLP_TRACES_ENDPOINT="${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT}"
          OTEL_EXPORTER_OTLP_LOGS_ENDPOINT="${OTEL_EXPORTER_OTLP_LOGS_ENDPOINT}"
          OTEL_EXPORTER_OTLP_PROTOCOL="${OTEL_EXPORTER_OTLP_PROTOCOL}"
          OTEL_EXPORTER_OTLP_HEADERS="${OTEL_EXPORTER_OTLP_HEADERS}"
          OTEL_EXPORTER_OTLP_TRACES_PROTOCOL="${OTEL_EXPORTER_OTLP_TRACES_PROTOCOL}"
          OTEL_EXPORTER_OTLP_TRACES_HEADERS="${OTEL_EXPORTER_OTLP_TRACES_HEADERS}"
          ENVFILE
          chmod 600 /tmp/deploy.env

          # Copy env file to server
          scp -o StrictHostKeyChecking=no /tmp/deploy.env "$SERVER_USER@$SERVER_HOST:/tmp/deploy.env"

          # Deploy script - source env file on remote server
          ssh -o StrictHostKeyChecking=no "$SERVER_USER@$SERVER_HOST" \
            "set -a && source /tmp/deploy.env && set +a && bash -s" << 'DEPLOY_SCRIPT'
          set -e

          # 1. Set dynamic project directory based on repository name
          PROJECT_NAME="blacki"
          PROJECT_DIR="$HOME/apps/$PROJECT_NAME"
          IMAGE_NAME="ghcr.io/queryplanner/blacki@${IMAGE_DIGEST}"

          cleanup() {
            rm -f "$PROJECT_DIR/.env.next" /tmp/deploy.env
          }
          trap cleanup EXIT

          echo "=== Deploying $PROJECT_NAME to $PROJECT_DIR ==="

          # 2. Ensure project directory exists
          mkdir -p "$PROJECT_DIR"
          if [ ! -d "$PROJECT_DIR/.git" ]; then
            echo "Project not found. Cloning..."
            git clone https://github.com/QueryPlanner/blacki "$PROJECT_DIR"
          fi

          # 3. Navigate and Update Code
          cd "$PROJECT_DIR"
          git fetch origin main
          git cat-file -e "${DEPLOY_SHA}^{commit}"
          git -c advice.detachedHead=false checkout --detach "$DEPLOY_SHA"

          # 4. Find an available port starting from 8080
          find_available_port() {
            local port=8080
            while ss -tuln | grep -q ":${port} " ; do
              port=$((port + 1))
              if [ $port -gt 8100 ]; then
                echo "ERROR: No available port in range 8080-8100" >&2
                exit 1
              fi
            done
            echo $port
          }

          # Preserve the current port so the staged config can be validated while
          # the existing container remains healthy.
          HOST_PORT=$(
            sed -n 's/^HOST_PORT="\{0,1\}\([0-9][0-9]*\)"\{0,1\}$/\1/p' \
              .env 2>/dev/null | tail -n 1
          )
          case "$HOST_PORT" in
            ''|*[!0-9]*) HOST_PORT=8080 ;;
          esac
          if [ "$HOST_PORT" -lt 1 ] || [ "$HOST_PORT" -gt 65535 ]; then
            HOST_PORT=8080
          fi

          # 5. Stage the next .env without replacing the active deployment.
          # Values are double-quoted so URLs with & ? @ are preserved verbatim.
          # Docker Compose dotenv parser strips surrounding quotes correctly.
          write_app_env() {
            local target=$1
            cat > "$target" << ENVFILE
          AGENT_NAME="${AGENT_NAME}"
          OPENROUTER_API_KEY="${OPENROUTER_API_KEY}"
          ROOT_AGENT_MODEL="${ROOT_AGENT_MODEL}"
          TELEGRAM_ENABLED="${TELEGRAM_ENABLED}"
          TELEGRAM_BOT_TOKEN="${TELEGRAM_BOT_TOKEN}"
          TELEGRAM_TOOL_NOTIFICATIONS="${TELEGRAM_TOOL_NOTIFICATIONS}"
          EXA_API_KEY="${EXA_API_KEY}"
          BRAVE_SEARCH_API_KEY="${BRAVE_SEARCH_API_KEY}"
          BROWSER_USE_API_KEY="${BROWSER_USE_API_KEY}"
          HOST_PORT="${HOST_PORT}"
          SANDBOX_ENABLED="${SANDBOX_ENABLED}"
          SANDBOX_DOMAIN="${SANDBOX_DOMAIN}"
          GOOGLE_API_KEY="${GOOGLE_API_KEY}"
          MEM0_QDRANT_URL="${MEM0_QDRANT_URL}"
          MEM0_QDRANT_API_KEY="${MEM0_QDRANT_API_KEY}"
          OTEL_EXPORTER_OTLP_ENDPOINT="${OTEL_EXPORTER_OTLP_ENDPOINT}"
          OTEL_EXPORTER_OTLP_TRACES_ENDPOINT="${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT}"
          OTEL_EXPORTER_OTLP_LOGS_ENDPOINT="${OTEL_EXPORTER_OTLP_LOGS_ENDPOINT}"
          OTEL_EXPORTER_OTLP_PROTOCOL="${OTEL_EXPORTER_OTLP_PROTOCOL}"
          OTEL_EXPORTER_OTLP_HEADERS="${OTEL_EXPORTER_OTLP_HEADERS}"
          OTEL_EXPORTER_OTLP_TRACES_PROTOCOL="${OTEL_EXPORTER_OTLP_TRACES_PROTOCOL}"
          OTEL_EXPORTER_OTLP_TRACES_HEADERS="${OTEL_EXPORTER_OTLP_TRACES_HEADERS}"
          ENVFILE
            chmod 600 "$target"
          }

          echo "Staging deployment environment..."
          write_app_env .env.next

          # 6. Pull and validate the exact image and staged environment before
          # interrupting the running deployment.
          echo "$GH_TOKEN" | docker login ghcr.io -u queryplanner --password-stdin
          export IMAGE="$IMAGE_NAME"
          echo "Pulling candidate image..."
          docker pull "$IMAGE_NAME"
          ENV_FILE=.env.next docker compose --env-file .env.next \
            -f compose.yaml -f compose.prod.yaml config --quiet
          docker run --rm --entrypoint python \
            --env OTEL_EXPORTER_OTLP_ENDPOINT \
            --env OTEL_EXPORTER_OTLP_TRACES_ENDPOINT \
            --env OTEL_EXPORTER_OTLP_PROTOCOL \
            --env OTEL_EXPORTER_OTLP_TRACES_PROTOCOL \
            --env OTEL_EXPORTER_OTLP_HEADERS \
            --env OTEL_EXPORTER_OTLP_TRACES_HEADERS \
            "$IMAGE_NAME" -c \
            "from blacki.utils.observability import validate_observability_environment; validate_observability_environment()"

          # 7. Promote the preflighted configuration and restart the deployment.
          echo "Stopping existing containers..."
          docker compose -f compose.yaml -f compose.prod.yaml \
            down --remove-orphans

          if ss -tuln | grep -q ":${HOST_PORT} " ; then
            HOST_PORT=$(find_available_port)
            write_app_env .env.next
          fi
          echo "Using port: $HOST_PORT"
          mv .env.next .env

          echo "Starting candidate image..."
          docker compose -f compose.yaml -f compose.prod.yaml up -d

          # 8. Health check with retries
          echo "Waiting for health check..."
          MAX_RETRIES=12
          RETRY_COUNT=0
          HEALTH_OK=false
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            if curl -sf http://localhost:${HOST_PORT}/ready > /dev/null 2>&1; then
              HEALTH_OK=true
              break
            fi
            RETRY_COUNT=$((RETRY_COUNT + 1))
            echo "Health check attempt $RETRY_COUNT/$MAX_RETRIES failed, retrying in 5s..."
            sleep 5
          done

          if [ "$HEALTH_OK" = true ]; then
            echo "✅ Health check passed on port ${HOST_PORT}!"
          else
            echo "⚠️ Health check failed after $MAX_RETRIES attempts, checking logs..."
            docker compose -f compose.yaml -f compose.prod.yaml logs --tail=100
            exit 1
          fi

          # 9. Reclaim space only after the candidate is healthy.
          echo "Cleaning up old Docker resources..."
          docker image prune -af 2>/dev/null || true
          docker builder prune -af 2>/dev/null || true
          docker system prune -af --volumes 2>/dev/null || true

          # 10. Show status
          echo "=== Deployment Complete ==="
          docker compose -f compose.yaml -f compose.prod.yaml ps
          df -h /
          DEPLOY_SCRIPT

      - name: Cleanup SSH
        if: always()
        run: |
          rm -f ~/.ssh/id_rsa /tmp/deploy.env
