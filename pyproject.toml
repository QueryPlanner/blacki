[project]
name = "blacki"
version = "0.1.0"
description = "A personal assistant agent designed to run on cheap self-hosted infrastructure using Google ADK on Bare Metal."
readme = "README.md"
authors = [
    { name = "queryplanner", email = "queryplanner@users.noreply.github.com" }
]
requires-python = ">=3.11,<3.14"
dependencies = [
    # Pin ADK to test releases before locking upgrades
    "google-adk[mcp]==2.5.0",
    "google-auth>=2.40.3,<3.0.0",
    "google-cloud-logging>=3.12.1,<4.0.0",
    "opentelemetry-exporter-gcp-logging>=1.9.0a0,<2.0.0",
    "opentelemetry-exporter-otlp-proto-grpc==1.42.1",
    "opentelemetry-exporter-otlp-proto-http==1.42.1",
    "opentelemetry-instrumentation-google-genai>=0.4b0,<0.5",
    "opentelemetry-instrumentation-logging>=0.63b0,<0.64",
    "pydantic>=2.11.0,<3.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "litellm>=1.60.0",
    "aiosqlite>=0.20.0",
    "greenlet>=3.0.0",
    "openinference-instrumentation-google-adk==0.1.17",
    "httpx>=0.27.0,<1.0.0",
    "pyyaml>=6.0.0,<7.0.0",
    "apscheduler>=3.11.0,<4.0.0",
    "dateparser>=1.2.0,<2.0.0",
    "opensandbox>=0.1.7",
    "mem0ai>=0.1.0,<1.0.0",
    "opensandbox-code-interpreter>=0.1.2",
    "boto3>=1.40.0,<2.0.0",
]

[project.scripts]
server = "blacki.server:main"

[dependency-groups]
dev = [
    "google-adk[eval]==2.5.0",
    "ruff>=0.12.7,<1.0.0",
    "mypy>=1.17.1,<2.0.0",
    "pytest>=8.3.4,<9.0.0",
    "pytest-cov>=7.0.0,<8.0.0",
    "pytest-asyncio>=1.2.0,<2.0.0",
    "ipykernel>=7.0.0,<8.0.0",
    "types-grpcio>=1.0.0.20251009,<2.0.0.0",
    "types-pyyaml>=6.0.0,<7.0.0",
]
docs = [
    "mkdocs-material>=9,<10",
]

[build-system]
requires = ["uv_build>=0.8.21,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "blacki"

[tool.ruff]
src = ["src"]
target-version = "py311"
line-length = 88
fix = true
extend-exclude = ["notebooks", "init_template.py"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "S",   # flake8-bandit
    "SIM", # flake8-simplify
    "PTH", # flake8-use-pathlib
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S106", "S108"]  # Allow assert, hardcoded passwords, and tmp paths in tests

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["blacki"]
exclude = ["init_template.py"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["apscheduler.*", "opensandbox.*", "mem0", "mem0.*", "boto3.*", "botocore.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "src/blacki/**/__init__.py",
    "src/blacki/**/agent.py",
    "src/blacki/memory/config.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 2
fail_under = 100

[tool.coverage.html]
directory = "htmlcov"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "error::RuntimeWarning",
    "error::ResourceWarning",
    "error::pytest.PytestUnraisableExceptionWarning",
    # google-genai still emits this third-party warning while constructing types.
    "ignore::pydantic.warnings.PydanticDeprecatedSince212:google.genai.types",
    # mem0 still uses instance-level model_fields in its project client.
    "ignore::pydantic.warnings.PydanticDeprecatedSince20:mem0.client.project",
]
