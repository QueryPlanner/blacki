<!doctype html>
<html lang="en" data-theme="blacki">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Blacki observability</title>
  <link rel="stylesheet" href="/dashboard/static/miniapp.css">
  <link rel="stylesheet" href="/dashboard/static/dashboard.css">
  <script src="/dashboard/static/dashboard.js" defer></script>
</head>
<body>
  <a class="skip" href="#main">Skip to dashboard</a>
  <header class="masthead">
    <div class="frame mast-row">
      <a class="brand" href="#sessions" aria-label="Blacki sessions">blacki <span>dashboard</span></a>
      <nav class="main-nav" aria-label="Dashboard views">
        <a href="#overview">Overview</a>
        <a href="#sessions" aria-current="page">Sessions</a>
        <a href="#traces">Traces</a>
        <a href="#logs">Logs</a>
      </nav>
      <span class="local-label"><span aria-hidden="true"></span> Private dashboard</span>
    </div>
  </header>
  <main id="main" class="frame" tabindex="-1">
    <div class="page-intro">
      <div>
        <h1 id="view-title">Sessions</h1>
        <p id="view-description">Read conversations, inspect captured model context, and browse a user’s wiki.</p>
      </div>
      <div class="page-actions">
        <label class="auto-refresh"><input id="auto-refresh" type="checkbox" checked> Auto-refresh</label>
        <button class="control" id="refresh" type="button">Refresh</button>
        <button class="control" id="theme-toggle" type="button" aria-pressed="false">Light theme</button>
      </div>
    </div>
    <div id="view" aria-busy="true"><p class="empty">Reading local files…</p></div>
    <p class="dashboard-foot">Read-only dashboard <span id="last-updated"></span></p>
  </main>
</body>
</html>
