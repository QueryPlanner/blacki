services:
  agent:
    image: ${IMAGE:-}
    build: .
    ports:
      - "${HOST_PORT:-8080}:8080"
    environment:
      - HOST=0.0.0.0
      - PORT=8080
      - AGENT_NAME=${AGENT_NAME:-local-dev}
      - LOG_LEVEL=INFO
      - RELOAD_AGENTS=true
      - SERVE_WEB_INTERFACE=true
      # DATABASE_URL and API Keys will be loaded from the .env file
    env_file:
      - .env
    # Volumes are for hot-reloading and persisting artifacts.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - agent_artifacts:/app/src/.adk
    restart: always
    command: python -m blacki.server

volumes:
  agent_artifacts:
